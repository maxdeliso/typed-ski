name: Setup Bazel
description: Configure Bazel caches via bazelisk.

inputs:
  disk-cache:
    description: Bazel disk cache name.
    required: true
  cache-save:
    description: Whether setup-bazel should save caches.
    required: true

runs:
  using: composite
  steps:
    # This action installs no host Node or pnpm: Bazel builds/tests use the
    # hermetic Node toolchain and npm_translate_lock. Publishing and packaging
    # checks install their own pinned host tools via setup-release-tools.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ inputs.disk-cache }}
        repository-cache: true
        cache-save: ${{ inputs.cache-save }}
